# Nginx gateway with basic auth and proxy to current active version
# Future blue-green: define upstreams app_v1 and app_v2 and switch symlink of /etc/nginx/conf.d/active.conf

worker_processes 1;

events { worker_connections 1024; }

http {
  # Active upstream is defined in included file for blue-green switching
  include /etc/nginx/conf.d/active.conf;

  # HTTP listener redirects to HTTPS
  server {
    listen 80;
    server_name api.rikkar25.treok.eu;
    return 301 https://$host$request_uri;
  }

  # HTTPS listener with TLS certs mounted at /etc/nginx/certs
  server {
    listen 443 ssl;
    server_name api.rikkar25.treok.eu;
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/htpasswd;

    location /status {
      proxy_pass http://app_active/status;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /log {
      proxy_pass http://app_active/log;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /health {
      auth_basic off;
      return 200 "OK";
    }
  }
}
